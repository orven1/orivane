[project]
name = "orivane"
version = "0.1.1"
description = "Orivane is a python package that makes modifing architecture of an already pretrained model easier."
license = { text = "MIT" }
authors = [{ name = "orven" }]
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "torch>=2.14.1",
]


[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
